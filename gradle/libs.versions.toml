[versions]
kotlinx-serialization-json = "1.11.0"
tomlj = "1.3.0"
snakeyaml-engine = "3.1.1"
junit4 = "4.13.2"
kotlin = "2.4.20"
pdfbox = "3.0.8"
batik = "1.19"
jai-imageio-jpeg2000 = "1.4.0"
jbig2-imageio = "3.0.5"
changelog = "2.5.0"
kover = "0.9.9"
junit-platform-launcher = "6.1.3"
picocli = "4.7.7"

[libraries]
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-platform-launcher" }
kotlin-test-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5", version.ref = "kotlin" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json-jvm", version.ref = "kotlinx-serialization-json" }
tomlj = { group = "org.tomlj", name = "tomlj", version.ref = "tomlj" }
snakeyaml-engine = { group = "org.snakeyaml", name = "snakeyaml-engine", version.ref = "snakeyaml-engine" }
picocli = { group = "info.picocli", name = "picocli", version.ref = "picocli" }
pdfbox = { group = "org.apache.pdfbox", name = "pdfbox", version.ref = "pdfbox" }
pdfbox-io = { group = "org.apache.pdfbox", name = "pdfbox-io", version.ref = "pdfbox" }
pdfbox-tools = { group = "org.apache.pdfbox", name = "pdfbox-tools", version.ref = "pdfbox" }
batik-svggen = { group = "org.apache.xmlgraphics", name = "batik-svggen", version.ref = "batik" }
batik-dom = { group = "org.apache.xmlgraphics", name = "batik-dom", version.ref = "batik" }
batik-transcoder = { group = "org.apache.xmlgraphics", name = "batik-transcoder", version.ref = "batik" }
batik-codec = { group = "org.apache.xmlgraphics", name = "batik-codec", version.ref = "batik" }
jai-imageio-jpeg2000 = { group = "com.github.jai-imageio", name = "jai-imageio-jpeg2000", version.ref = "jai-imageio-jpeg2000" }
jbig2-imageio = { group = "org.apache.pdfbox", name = "jbig2-imageio", version.ref = "jbig2-imageio" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version = "2.19.0" }
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
