name: Test

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check formatting and run tests
        run: ./gradlew ktfmtCheck test --no-daemon --console=plain
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

  releaseDraft:
    name: Release draft
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release ') }}"
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create release draft with Marketplace downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(./gradlew properties --property version --quiet --console=plain | tail -n 1 | cut -f2- -d ' ')
          RELEASE_NOTE="./build/tmp/release_note.txt"
          ./gradlew getChangelog --project-version="$VERSION" --no-header --quiet --console=plain --output-file="$RELEASE_NOTE"

          cat >> "$RELEASE_NOTE" <<EOF

          ## Downloads

          - [Download ${VERSION} ZIP](https://plugins.jetbrains.com/plugin/download?pluginId=de.moritzf.openai-usage-quota&version=${VERSION})
          - [JetBrains Marketplace versions](https://plugins.jetbrains.com/plugin/30690/versions)

          Downloads become available after JetBrains Marketplace approval.
          EOF

          gh release create "$VERSION" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file "$RELEASE_NOTE"
